name: Community Extension Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag or 40-character commit hash to publish
        required: true
      github_repo:
        description: GitHub repository as OWNER/REPO
        required: true
      maintainer:
        description: GitHub username for descriptor maintainers
        required: true

permissions:
  contents: read

jobs:
  descriptor:
    name: Render community descriptor
    runs-on: ubuntu-latest
    env:
      RELEASE_REF: ${{ github.event.release.tag_name || inputs.ref }}
      RELEASE_REPO: ${{ inputs.github_repo || github.repository }}
      RELEASE_MAINTAINER: ${{ inputs.maintainer || github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Render descriptor for release ref
        run: |
          python3 scripts/render_community_descriptor.py \
            --ref "$RELEASE_REF" \
            --github "$RELEASE_REPO" \
            --maintainer "$RELEASE_MAINTAINER"

      - name: Validate rendered descriptor
        run: |
          python3 scripts/check_release_ready.py \
            --description-path build/community-extensions/extensions/flight/description.yml \
            --strict-community-ref

      - name: Upload descriptor artifact
        uses: actions/upload-artifact@v4
        with:
          name: flight-community-extension-descriptor
          path: build/community-extensions/extensions/flight/description.yml
