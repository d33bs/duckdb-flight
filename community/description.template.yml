extension:
  name: flight
  description: Query Arrow Flight services from DuckDB.
  version: 0.1.0
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl"
  requires_toolchains: "rust;python3"
  maintainers:
    - TODO_GITHUB_USERNAME

repo:
  github: TODO_OWNER/TODO_REPO
  ref: TODO_RELEASE_COMMIT_SHA

docs:
  hello_world: |
    SELECT *
    FROM flight('grpc://localhost:5005', ['warehouse', 'events'])
    LIMIT 5;
  extended_description: |
    `flight` lets DuckDB query Arrow Flight services with normal SQL. It is useful when data should stay behind a service boundary, such as governed data products, remote query engines, cross-cloud datasets, or partitioned Flight endpoints. Use native DuckDB scans when DuckDB should read the files directly; use `flight` when a service should deliver Arrow batches.
